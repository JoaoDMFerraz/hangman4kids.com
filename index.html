document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

=\"150\" stroke=\"#333\" stroke-width=\"3\" style=\"animation: colorShift 15s ease infinite; {{ bodyDisplayStyle }}\"><\u002Fline>\n            <line x1=\"110\" y1=\"100\" x2=\"70\" y2=\"120\" stroke=\"#333\" stroke-width=\"3\" style=\"animation: colorShift 15s ease infinite; {{ leftArmDisplayStyle }}\"><\u002Fline>\n            <line x1=\"110\" y1=\"100\" x2=\"150\" y2=\"120\" stroke=\"#333\" stroke-width=\"3\" style=\"animation: colorShift 15s ease infinite; {{ rightArmDisplayStyle }}\"><\u002Fline>\n            <line x1=\"110\" y1=\"150\" x2=\"80\" y2=\"210\" stroke=\"#333\" stroke-width=\"3\" style=\"animation: colorShift 15s ease infinite; {{ leftLegDisplayStyle }}\"><\u002Fline>\n            <line x1=\"110\" y1=\"150\" x2=\"140\" y2=\"210\" stroke=\"#333\" stroke-width=\"3\" style=\"animation: colorShift 15s ease infinite; {{ rightLegDisplayStyle }}\"><\u002Fline>\n          <\u002Fsvg>\n        <\u002Fdiv>\n\n        <div style=\"flex: 1.6; min-width: 220px; display: flex; flex-direction: column; gap: 12px; min-height: 0;\">\n          <div style=\"background: white; padding: 14px; border-radius: 20px; border: 3px solid #4D96FF; box-shadow: 0 4px 14px rgba(77,150,255,0.15);\">\n            <div aria-live=\"polite\" style=\"{{ wordDisplayStyle }}\">{{ wordDisplayText }}<\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;\">\n              <div aria-live=\"polite\" style=\"background: linear-gradient(135deg, #FFD93D 0%, #FFEA9C 100%); padding: 10px 14px; border-radius: 12px; border: 2px solid #FF8C42; text-align: center; flex: 1; min-width: 100px;\">\n                <div style=\"font-size: 0.75em; color: #333; font-weight: bold; margin-bottom: 4px;\">CHANCES LEFT<\u002Fdiv>\n                <div style=\"font-size: 1.8em; color: #FF6B6B; font-weight: bold; line-height: 1;\">{{ triesRemaining }}<\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ showHint }}\" disabled=\"{{ hintDisabled }}\" style=\"{{ hintBtnStyle }}\">{{ hintButtonText }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background: white; padding: 12px; border-radius: 20px; border: 3px solid #FFD93D; box-shadow: 0 4px 14px rgba(255,217,61,0.15); flex: 1; min-height: 0; display: flex; flex-direction: column;\">\n            <div style=\"text-align: center; font-weight: bold; color: #FF8C42; font-size: 0.9em; margin-bottom: 8px;\">Click Letters or Use Your Keyboard<\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(34px, 1fr)); gap: 6px; flex: 1; align-content: center; overflow: auto;\">\n              <sc-for list=\"{{ alphabet }}\" as=\"l\" hint-placeholder-count=\"26\">\n                <button sc-camel-on-click=\"{{ l.onClick }}\" disabled=\"{{ l.disabled }}\" style=\"{{ l.style }}\">{{ l.letter }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;\">\n        <div style=\"{{ progressBoxStyle }}\">\n          <div style=\"font-size: 0.65em; letter-spacing: 0.5px; opacity: 0.85;\">PROGRESS<\u002Fdiv>\n          <div style=\"font-size: 1.25em; font-weight: bold; line-height: 1.1;\">{{ progressPercent }}%<\u002Fdiv>\n          <div style=\"font-size: 0.7em;\">✅ {{ sessionCorrect }} · ❌ {{ sessionWrong }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ newGame }}\" style=\"flex: 1; min-width: 90px; padding: 10px 16px; font-size: 0.95em; font-weight: bold; border: none; border-radius: 16px; cursor: pointer; font-family: inherit; box-shadow: 0 4px 14px rgba(0,0,0,0.15); background: linear-gradient(135deg, #4D96FF 0%, #7BB8FF 100%); color: white;\">New Word<\u002Fbutton>\n        <div style=\"display: flex; gap: 6px; flex: 1.4; min-width: 160px;\">\n          <button sc-camel-on-click=\"{{ setEasy }}\" style=\"{{ easyBtnStyle }}\">Easy<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ setHard }}\" style=\"{{ hardBtnStyle }}\">Hard<\u002Fbutton>\n        <\u002Fdiv>\n        \n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; z-index: 10000; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; animation: fadeIn 0.3s ease;\">\n      <div style=\"background: linear-gradient(135deg, #FFFACD, #FFE4B5); border: 7px solid #FFD700; border-radius: 32px; padding: 32px; text-align: center; max-width: 440px; width: 90%; box-shadow: 0 10px 50px rgba(0,0,0,0.3); animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);\">\n        <div style=\"{{ modalMessageStyle }}\">{{ modalMessage }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeModal }}\" style=\"background: linear-gradient(135deg, #4D96FF 0%, #7BB8FF 100%); color: white; border: none; padding: 14px 34px; font-size: 1.15em; font-weight: bold; border-radius: 20px; cursor: pointer; font-family: inherit; box-shadow: 0 6px 18px rgba(77,150,255,0.3); margin-top: 16px;\">Play Again!<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-for list=\"{{ confetti }}\" as=\"c\" hint-placeholder-count=\"0\">\n    <div style=\"{{ c.style }}\"><\u002Fdiv>\n  <\u002Fsc-for>\n\n  <div style=\"text-align: center; color: rgba(255,255,255,0.85); font-size: 12px; font-family: sans-serif;\">\n    <a href=\"#\" style=\"color: #fff; text-decoration: underline;\">Privacy Policy<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst EASY_WORDS = [\n  ['APPLE','A red or green fruit that grows on trees'],['BABY','A very young child'],['BALL','Round toy you can throw'],\n  ['BANANA','Yellow curved fruit'],['BEAR','Large furry animal'],['BED','Furniture for sleeping'],['BE 'FROG','Jumping green animal'],['FRUIT','Sweet food from plants'],\n  ['GARDEN','Place to grow plants'],['GHOST','Spirit of a dead person'],['GIANT','Extremely large being'],['GIFT','Present given to someone'],\n  ['GIRAFFE','Tall African animal'],['GIRL','Young female person'],['GLASS','Clear drinking container'],['GLOVE','Hand covering'],\n  ['GOAT','Farm animal with horns'],['GOLD','Yellow precious metal'],['GOOSE','Water bird larger than duck'],['GORILLA','Large ape'],\n  ['GRAPE','Small round fruit'],['GRASS','Green plant covering ground'],['GUITAR','Stringed instrument'],\n  ['HAND','Body part with fingers'],['HAT','Head covering'],['HEART','Organ that pumps blood'],['HEN','Female chicken'],\n  ['HIVE','Home for bees'],['HONEY','Sweet food made by bees'],['HORSE','Animal you can ride'],['HOUSE','Place where people live'],\n  ['ICE','Frozen water'],['INSECT','Small six-legged creature'],['ISLAND','Land surrounded by water'],['JACKET','Warm outer clothing'],\n  ['JAR','Glass container'],['JELLY','Sweet fruit spread'],['JUICE','Drink made from fruit'],['JUNGLE','Dense tropical forest'],\n  ['KANGAROO','Jumping Australian animal'],['KETTLE','Pot for boiling water'],['KEY','Tool that opens locks'],['KING','Male ruler'],\n  ['KITCHEN','Room for cooking'],['KITE','Toy that flies in wind'],['KITTEN','Baby cat'],['KNIFE','Cutting tool'],\n  ['LADDER','Tool for climbing'],['LAMP','Light source'],['LEAF','Part of a plant'],['LEMON','Sour yellow fruit'],\n  ['LETTER','Written message'],['LION','King of the jungle'],['LIZARD','Small reptile'],['MAGNET','Object that attracts metal'],\n  ['MAP','Drawing of a place'],['MELON','Large sweet fruit'],['MILK','White drink from cows'],['MIRROR','Glass that reflects'],\n  ['MONKEY','Playful jungle animal'],['MOON','Object seen at night'],['MOUNTAIN','Very tall landform'],['MOUSE','Small rodent'],\n  ['MUSHROOM','Fungus that grows in forests'],['NEST','Home for birds'],['NOTEBOOK','Book for writing'],['NUMBER','Symbol for counting'],\n  ['NURSE','Person who helps sick people'],['OCEAN','Large body of salt water'],['OCTOPUS','Sea animal with eight arms'],['ONION','Vegetable with layers'],\n  ['ORANGE','Round citrus fruit'],['OWL','Bird that hoots at night'],['PAINT','Colored liquid for art'],['PANDA','Black and white bear'],\n  ['PENCIL','Tool for writing'],['PENGUIN','Flightless bird from Antarctica'],['PIANO','Musical instrument with keys'],['PIG','Farm animal that oinks'],\n  ['PILLOW','Soft cushion for sleeping'],['PIRATE','Sea robber'],['PIZZA','Round baked dish with toppings'],['PLANET','Large body orbiting a star'],\n  ['PLANT','Living thing that grows'],['POCKET','Small pouch in clothing'],['POND','Small body of water'],['PONY','Small horse'],\n  ['POTATO','Starchy vegetable'],['PRINCESS','Daughter of a king'],['PUMPKIN','Orange autumn vegetable'],['PUPPY','Baby dog'],\n  ['QUEEN','Female ruler'],['QUILT','Warm bed cover'],['RABBIT','Animal with long ears'],['RAIN','Water falling from clouds'],\n  ['RAINBOW','Colorful arc in the sky'],['RIVER','Flowing body of water'],['ROBOT','Machine that acts like a person'],['ROCKET','Vehicle that flies to space'],\n  ['ROOSTER','Male chicken'],['ROSE','Fragrant flower'],['SANDWICH','Food between bread slices'],['SCHOOL','Place for learning'],\n  ['SCISSORS','Tool for cutting paper'],['SEAHORSE','Small curved sea creature'],['SHARK','Large ocean predator fish'],['SHEEP','Woolly farm animal'],\n  ['SHOE','Foot covering'],['SNAIL','Slow creature with a shell'],['SNAKE','Long legless reptile'],['SNOWMAN','Figure made of snow'],\n  ['SPIDER','Eight-legged creature'],['SQUIRREL','Small tree-climbing animal'],['STAR','Bright object in the night sky'],['SUN','Star at the center of our solar system'],\n  ['SWAN','Graceful white water bird'],['TABLE','Furniture with a flat top'],['TIGER','Striped big cat'],['TOMATO','Red round fruit'],\n  ['TOOTHBRUSH','Tool for cleaning teeth'],['TRAIN','Vehicle that runs on tracks'],['TREE','Tall plant with a trunk'],['TRUCK','Large vehicle for hauling'],\n  ['TURTLE','Reptile with a shell'],['UMBRELLA','Tool to stay dry in rain'],['UNICORN','Mythical horned horse'],['VASE','Container for flowers'],\n  ['VIOLIN','Stringed musical instrument'],['VOLCANO','Mountain that erupts'],['WAGON','Small cart with wheels'],['WATERMELON','Large juicy green fruit'],\n  ['WHALE','Huge sea mammal'],['WINDOW','Opening in a wall for light'],['WOLF','Wild relative of dogs'],['ZEBRA','Striped horse-like animal'],\n];\nconst HARD_WORDS = [\n  ['ABILITY','Skill or talent'],['ABSORB','Take in or soak up'],['ABUNDANT','Plentiful or ample'],['ACADEMY','School or institution'],\n  ['ACCELERATE','Speed up'],['ACCIDENT','Unplanned event'],['ACCOMPLISH','Complete successfully'],['ACCURATE','Precise or correct'],\n  ['ACHIEVE','Accomplish or attain'],['ACQUIRE','Obtain or get'],['ACROBAT','Gymnastic performer'],['ADAPT','Adjust to new conditions'],\n  ['ADEQUATE','Sufficient or satisfactory'],['ADJACENT','Next to or nearby'],['ADMIRE','Respect or esteem'],['ADOLESCENT','Teenager'],\n  ['ADVANTAGE','Beneficial position'],['ADVENTURE','Exciting journey'],['ADVERSARY','Enemy or opponent'],['AESTHETIC','Artistic or beautiful'],\n  ['AFFECTION','Fondness'],['AGGRESSION','Hostile attack'],['AGILITY','Nimbleness'],['AGRICULTURE','Farming practices'],\n  ['ALLEGIANCE','Loyalty or devotion'],['ALLERGY','Adverse reaction'],['ALLIANCE','Union or partnership'],['ALLIGATOR','Large reptile'],\n  ['ALPHABET','Letters of a language'],['ALTITUDE','Height above ground'],['ALUMINUM','Lightweight metal'],['AMAZEMENT','Surprise or wonder'],\n  ['AMBASSADOR','Official representative'],['AMBITIOUS','Having strong goals'],['AMBULANCE','Emergency vehicle'],['AMPHIBIAN','Land and water animal'],\n  ['ANALYSIS','Detailed examination'],['ANATOMY','Body structure'],['ANCESTOR','Forebear or relative'],['ANCIENT','Very old'],\n  ['ANECDOTE','Short story'],['ANGUISH','Severe pain or suffering'],['ANIMATION','Movement or liveliness'],['ANNIVERSARY','Annual celebration'],\n  ['ANNOUNCE','Make public'],['ANONYMOUS','Unnamed'],['ANTAGONIST','Opponent'],['ANTARCTIC','South polar region'],\n  ['ANTELOPE','Horned animal'],['ANTHOLOGY','Collection of works'],['ANTIBIOTIC','Bacteria fighter'],['ANTICIPATE','Expect or foresee'],\n  ['APPRECIATE','Value or be grateful for'],['ARCHITECT','Building designer'],['ARTIFICIAL','Not natural, man-made'],['ASSEMBLE','Put together'],\n  ['ASTONISH','Surprise greatly'],['ATMOSPHERE','Air surrounding Earth'],['ATTENTIVE','Paying close attention'],['AUTHENTIC','Genuine or real'],\n  ['AVALANCHE','Mass of falling snow'],['AWKWARD','Clumsy or uncomfortable'],['BENEFICIAL','Helpful or advantageous'],['BOUNDARY','Dividing line'],\n  ['CATASTROPHE','Sudden great disaster'],['CELEBRATE','Honor a special occasion'],['CHALLENGE','Difficult task'],['CIRCUMSTANCE','Condition or fact'],\n  ['COLLABORATE','Work together'],['COMPASSION','Sympathy for others'],['CONFIDENT','Sure of oneself'],['CONTRIBUTE','Give to help'],\n  ['CURIOSITY','Desire to learn'],['DETERMINED','Firmly decided'],['DISCOVER','Find something new'],['ENTHUSIASM','Eager enjoyment'],\n  ['ENVIRONMENT','Surroundings'],['EXAGGERATE','Overstate'],['EXTRAORDINARY','Very unusual'],['FASCINATE','Attract strongly'],\n  ['GENEROUS','Willing to give'],['GRATITUDE','Thankfulness'],['HESITATE','Pause before acting'],['IMAGINATION','Ability to form ideas'],\n  ['INDEPENDENT','Self-reliant'],['INSPIRATION','Stimulus for creativity'],['JUSTIFY','Give a good reason'],['KNOWLEDGE','Facts and information'],\n  ['MAGNIFICENT','Extremely beautiful'],['NEGOTIATE','Discuss to reach agreement'],['OBSTACLE','Something blocking progress'],['PERSEVERE','Keep trying'],\n  ['QUALIFY','Meet requirements'],['RESPONSIBLE','Accountable'],['SIGNIFICANT','Important'],['TREMENDOUS','Very great'],\n  ['UNIVERSAL','Applying to all'],['VOCABULARY','Words known'],['WILDERNESS','Wild natural land'],['YOUTHFUL','Young in appearance'],\n];\nconst BODY_PARTS = ['head','body','leftarm','rightarm','leftleg','rightleg'];\nconst LETTER_STYLE_BASE = {\n  padding: '8px', fontSize: '0.95em', fontWeight: 'bold', border: '2px solid #FFD93D',\n  background: 'linear-gradient(135deg, #FFE66D 0%, #FFED4E 100%)', color: '#333', borderRadius: '12px',\n  cursor: 'pointer', fontFamily: 'inherit', boxShadow: '0 3px 8px rgba(255,217,61,0.3)',\n};\nconst LETTER_STYLE_CORRECT = { ...LETTER_STYLE_BASE, opacity: 0.4, cursor: 'not-allowed', background: '#DDD', borderColor: '#999', color: '#999' };\nconst LETTER_STYLE_WRONG = { ...LETTER_STYLE_BASE, opacity: 0.4, cursor: 'not-allowed', background: '#DDD', borderColor: '#999', color: '#999' };\n\nfunction pickWord(list) {\n  const [word, hint] = list[Math.floor(Math.random() * list.length)];\n  return { word, hint };\n}\n\nclass Component extends DCLogic {\n  state = {\n    difficulty: 'easy',\n    selectedWord: '', selectedHint: '',\n    guessedLetters: [], wrongGuesses: [],\n    gameOver: false, gameWon: false, hintUsed: false,\n    modalOpen: false, modalMessage: '', modalWon: false,\n    confetti: [],\n    sessionCorrect: typeof window !== 'undefined' ? parseInt(localStorage.getItem('h4k_correct') || '0', 10) : 0,\n    sessionWrong: typeof window !== 'undefined' ? parseInt(localStorage.getItem('h4k_wrong') || '0', 10) : 0,\n    shakeWord: false,\n    vw: typeof window !== 'undefined' ? window.innerWidth : 1280,\n    vh: typeof window !== 'undefined' ? window.innerHeight : 800,\n  };\n\n  componentDidMount() {\n    this._start();\n    this._onKey = (e) => this._handleKey(e);\n    this._onResize = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight });\n    window.addEventListener('keydown', this._onKey);\n    window.addEventListener('resize', this._onResize);\n  }\n\n  _beep(freq, duration) {\n    try {\n      const ctx = this._audioCtx || (this._audioCtx = new (window.AudioContext || window.webkitAudioContext)());\n      const osc = ctx.createOscillator();\n      const gain = ctx.createGain();\n      osc.type = 'sine';\n      osc.frequency.value = freq;\n      gain.gain.setValueAtTime(0.15, ctx.currentTime);\n      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);\n      osc.connect(gain);\n      gain.connect(ctx.destination);\n      osc.start();\n      osc.stop(ctx.currentTime + duration);\n    } catch (e) {}\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('keydown', this._onKey);\n    window.removeEventListener('resize', this._onResize);\n  }\n\n  _start() {\n    const list = this.state.difficulty === 'easy' ? EASY_WORDS : HARD_WORDS;\n    const { word, hint } = pickWord(list);\n    this.setState({\n      selectedWord: word, selectedHint: hint,\n      guessedLetters: [], wrongGuesses: [],\n      gameOver: false, gameWon: false, hintUsed: false,\n      modalOpen: false, confetti: [],\n    });\n  }\n\n  _handleKey(e) {\n    if (this.state.gameOver) return;\n    const letter = e.key.toUpperCase();\n    if (/^[A-Z]$/.test(letter)) this._guess(letter);\n  }\n\n  _guess(letter) {\n    const { guessedLetters, wrongGuesses, gameOver, selectedWord } = this.state;\n    if (gameOver || guessedLetters.includes(letter) || wrongGuesses.includes(letter)) return;\n    let newGuessed = guessedLetters, newWrong = wrongGuesses;\n    if (selectedWord.includes(letter)) {\n      newGuessed = [...guessedLetters, letter];\n      this._beep(660, 0.15);\n    } else {\n      newWrong = [...wrongGuesses, letter];\n      this._beep(180, 0.25);\n      this.setState({ shakeWord: true });\n      setTimeout(() => this.setState({ shakeWord: false }), 400);\n    }\n    const won = selectedWord.split('').every(ch => newGuessed.includes(ch));\n    const lost = newWrong.length >= 6;\n    this.setState({ guessedLetters: newGuessed, wrongGuesses: newWrong }, () => {\n      if (won) {\n        this._beep(880, 0.2);\n        setTimeout(() => this._beep(1175, 0.3), 150);\n        this.setState(s => {\n          const sessionCorrect = s.sessionCorrect + 1;\n          localStorage.setItem('h4k_correct', sessionCorrect);\n          return { gameWon: true, gameOver: true, confetti: this._makeConfetti(), sessionCorrect };\n        });\n        setTimeout(() => this._start(), 1800);\n      } else if (lost) {\n        this._beep(140, 0.4);\n        this.setState(s => {\n          const sessionWrong = s.sessionWrong + 1;\n          localStorage.setItem('h4k_wrong', sessionWrong);\n          return { gameOver: true, modalOpen: true, modalMessage: `The word was: ${selectedWord}`, modalWon: false, sessionWrong };\n        });\n      }\n    });\n  }\n\n  _makeConfetti() {\n    const colors = ['#FFD93D', '#FF6B6B', '#4D96FF', '#6BCB77', '#FF8C42'];\n    return Array.from({ length: 40 }, (_, i) => {\n      const size = Math.random() * 8 + 5;\n      return {\n        id: i,\n        style: {\n          position: 'fixed', pointerEvents: 'none', zIndex: 9999,\n          left: Math.random() * 100 + 'vw', top: '-10px',\n          width: size + 'px', height: size + 'px',\n          background: colors[Math.floor(Math.random() * colors.length)],\n          borderRadius: Math.random() * 50 + '%',\n          opacity: Math.random() * 0.8 + 0.2,\n          animation: `confettiFall 3s ease-in forwards`,\n          animationDelay: (Math.random() * 0.5) + 's',\n          transform: `rotateZ(${Math.random() * 360}deg)`,\n        },\n      };\n    });\n  }\n\n  renderVals() {\n    const { selectedWord, guessedLetters, wrongGuesses, difficulty, hintUsed, gameOver, selectedHint, modalOpen, modalMessage, modalWon, confetti, vw, vh, sessionCorrect, sessionWrong, shakeWord } = this.state;\n    const wordDisplayText = selectedWord.split('').map(ch => (guessedLetters.includes(ch) ? ch : '_')).join(' ');\n    const wrongCount = wrongGuesses.length;\n\n    const gameMaxWidth = Math.round(Math.max(520, Math.min(900, vw - 40)));\n    const mainMaxWidth = gameMaxWidth;\n\n    const alphabet = Array.from({ length: 26 }, (_, i) => {\n      const letter = String.fromCharCode(65 + i);\n      const isCorrect = guessedLetters.includes(letter);\n      const isWrong = wrongGuesses.includes(letter);\n      const disabled = isCorrect || isWrong || gameOver;\n      return {\n        letter, disabled,\n        onClick: () => this._guess(letter),\n        style: isCorrect ? LETTER_STYLE_CORRECT : isWrong ? LETTER_STYLE_WRONG : (gameOver ? { ...LETTER_STYLE_BASE, opacity: 0.4, cursor: 'not-allowed' } : LETTER_STYLE_BASE),\n      };\n    });\n\n    const easyActive = difficulty === 'easy';\n    const btnEasyBase = { flex: 1, padding: '10px 16px', fontSize: '1em', fontWeight: 'bold', border: 'none', borderRadius: '13px', cursor: 'pointer', fontFamily: 'inherit', boxShadow: '0 3px 10px rgba(0,0,0,0.15)', background: 'linear-gradient(135deg, #6BCB77 0%, #7FD899 100%)', color: 'white' };\n    const btnHardBase = { flex: 1, padding: '10px 16px', fontSize: '1em', fontWeight: 'bold', border: 'none', borderRadius: '13px', cursor: 'pointer', fontFamily: 'inherit', boxShadow: '0 3px 10px rgba(0,0,0,0.15)', background: 'linear-gradient(135deg, #FF6B6B 0%, #FF8383 100%)', color: 'white' };\n\n    const partStyle = (n) => (wrongCount >= n ? { display: 'block' } : { display: 'none' });\n\n    return {\n      wordDisplayText,\n      wordDisplayStyle: {\n        fontSize: '1.8em', letterSpacing: '6px', textAlign: 'center', marginBottom: '12px', fontWeight: 'bold',\n        color: shakeWord ? '#FF6B6B' : '#4D96FF', fontFamily: \"'Courier New', monospace\", minHeight: '46px',\n        display: 'flex', alignItems: 'center', justifyContent: 'center', wordBreak: 'break-word',\n        animation: shakeWord ? 'shake 0.4s ease' : 'none',\n      },\n      triesRemaining: 6 - wrongCount,\n      alphabet,\n      hintButtonText: hintUsed ? '💡 ' + selectedHint : '💡 Get Hint',\n      hintDisabled: hintUsed || gameOver,\n      hintBtnStyle: {\n        flex: 1, padding: '10px 14px', background: hintUsed ? '#999' : 'linear-gradient(135deg, #6BCB77 0%, #7FD899 100%)',\n        color: 'white', border: 'none', borderRadius: '13px', fontSize: '0.9em', fontWeight: 'bold',\n        cursor: hintUsed ? 'not-allowed' : 'pointer', fontFamily: 'inherit', minWidth: '120px',\n        display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center', lineHeight: 1.3,\n      },\n      showHead: wrongCount >= 1,\n      headDisplayStyle: `display:${wrongCount >= 1 ? 'block' : 'none'}`,\n      bodyDisplayStyle: `display:${wrongCount >= 2 ? 'block' : 'none'}`,\n      leftArmDisplayStyle: `display:${wrongCount >= 3 ? 'block' : 'none'}`,\n      rightArmDisplayStyle: `display:${wrongCount >= 4 ? 'block' : 'none'}`,\n      leftLegDisplayStyle: `display:${wrongCount >= 5 ? 'block' : 'none'}`,\n      rightLegDisplayStyle: `display:${wrongCount >= 6 ? 'block' : 'none'}`,\n      easyBtnStyle: easyActive ? { ...btnEasyBase, boxShadow: '0 5px 14px rgba(107,203,119,0.6)', transform: 'scale(1.04)' } : btnEasyBase,\n      hardBtnStyle: !easyActive ? { ...btnHardBase, boxShadow: '0 5px 14px rgba(255,107,107,0.6)', transform: 'scale(1.04)' } : btnHardBase,\n      setEasy: () => this.setState({ difficulty: 'easy' }, () => this._start()),\n      setHard: () => this.setState({ difficulty: 'hard' }, () => this._start()),\n      resetGame: () => this._start(),\n      newGame: () => this._start(),\n      showHint: () => { if (!hintUsed && !gameOver) this.setState({ hintUsed: true }); },\n      modalOpen, modalMessage,\n      modalMessageStyle: {\n        fontSize: '2.2em', fontWeight: 'bold', marginBottom: '16px', letterSpacing: '0.5px',\n        fontFamily: \"'Comic Sans MS', cursive\", color: modalWon ? '#6BCB77' : '#FF6B6B',\n        animation: modalWon ? 'bounce 0.6s ease' : 'none',\n      },\n      closeModal: () => { this.setState({ modalOpen: false }); this._start(); },\n      confetti,\n      gameMaxWidth,\n      mainMaxWidth,\n      gameCardStyle: {\n        background: 'linear-gradient(135deg, #FFFACD 0%, #FFE4B5 100%)', padding: '18px', borderRadius: '28px',\n        boxShadow: '0 12px 40px rgba(0,0,0,0.15)', width: '100%', maxWidth: gameMaxWidth + 'px',\n        border: '5px solid #FFD700', boxSizing: 'border-box', display: 'flex', flexDirection: 'column',\n      },\n      sessionCorrect, sessionWrong,\n      progressPercent: (sessionCorrect + sessionWrong) === 0 ? 0 : Math.round((sessionCorrect / (sessionCorrect + sessionWrong)) * 100),\n      progressBoxStyle: {\n        flex: 1, minWidth: '100px', background: 'linear-gradient(135deg, #FFD93D 0%, #FFEA9C 100%)',\n        border: '2px solid #FF8C42', borderRadius: '16px', padding: '8px 12px', textAlign: 'center',\n        color: '#5c4a1a', display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: '2px',\n      },\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
